; ============================================================================
; FormPilot AI — Asterisk Dialplan (extensions.conf)
; ============================================================================
; WHAT THIS FILE DOES:
; Defines call routing rules. When a softphone calls any number (or ext 8000),
; Asterisk routes the call to our Node.js FastAGI server on agi://127.0.0.1:4573.
; ============================================================================

[general]
static=yes
writeprotect=no

[formpilot-incoming]
; Extension 8000 (or any numeric extension): Connect to AI Voice Assistant
exten => 8000,1,NoOp(--- FormPilot AI Voice Call Connected ---)
 same => n,Answer()
 same => n,AGI(agi://127.0.0.1:4573)
 same => n,Hangup()

; Catch-all pattern for testing
exten => _X.,1,NoOp(--- Catch-all routing to FormPilot AI ---)
 same => n,Answer()
 same => n,AGI(agi://127.0.0.1:4573)
 same => n,Hangup()
