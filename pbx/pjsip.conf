; ============================================================================
; FormPilot AI — PJSIP Configuration (Asterisk 16+)
; ============================================================================
; WHAT THIS FILE DOES:
; Configures Asterisk's modern SIP driver (res_pjsip) for transport,
; authentication, endpoints, and Address of Record (AOR).
; ============================================================================

[global]
type=global
user_agent=FormPilot-Asterisk-PBX

; ----------------------------------------------------------------------------
; UDP Transport (Standard SIP port 5060)
; ----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ----------------------------------------------------------------------------
; Endpoint Definition: Extension 1001 (Softphone / WebRTC client)
; ----------------------------------------------------------------------------
[1001]
type=endpoint
context=formpilot-incoming
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=formpilotpass

[1001]
type=aor
max_contacts=2
remove_existing=yes
