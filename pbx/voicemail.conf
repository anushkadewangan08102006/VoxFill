; ============================================================================
; FormPilot AI — Voicemail Configuration (voicemail.conf)
; ============================================================================
; WHAT THIS FILE DOES:
; Configures voicemail fallback contexts for Asterisk.
; ============================================================================

[general]
format=wav49|wav
serveremail=asterisk
attach=yes
skipms=3000
maxsilence=10
silencethreshold=128
maxmessage=300
minmessage=3

[default]
1001 => 1234,FormPilot User,user@example.com
