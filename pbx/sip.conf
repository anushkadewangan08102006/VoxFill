; ============================================================================
; FormPilot AI — Legacy SIP Configuration (chan_sip)
; ============================================================================
; WHAT THIS FILE DOES:
; Configures legacy chan_sip for backward compatibility with older Asterisk
; setups or legacy SIP softphones.
; ============================================================================

[general]
context=default
allowguest=no
udpbindaddr=0.0.0.0:5060
tcpenable=yes
tcpbindaddr=0.0.0.0:5060
transport=udp
srvlookup=no
disallow=all
allow=ulaw
allow=alaw
useragent=FormPilot-Asterisk-Legacy

; ----------------------------------------------------------------------------
; Peer: Extension 1001
; ----------------------------------------------------------------------------
[1001]
type=friend
secret=formpilotpass
host=dynamic
context=formpilot-incoming
qualify=yes
directmedia=no
